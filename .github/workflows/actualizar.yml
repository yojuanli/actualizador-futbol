name: Actualizar Ligas Automuestreo

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install curl_cffi

      - name: Descargar CSVs con Diagnóstico
        run: |
          python -c "
          from curl_cffi import requests
          import os

          os.makedirs('data', exist_ok=True)
          url = 'https://www.football-data.co.uk/mmz4281/2526/SP1.csv'
          
          try:
              res = requests.get(url, impersonate='chrome', timeout=30)
              print(f'Código HTTP recibido: {res.status_code}')
              print(f'Primeros 300 caracteres de la respuesta: {res.text[:300]}')
              
              if res.status_code == 200 and 'Div' in res.text and 'HomeTeam' in res.text:
                  with open('data/SP1.csv', 'w', encoding='utf-8') as f:
                      f.write(res.text)
                  print('✅ SP1.csv guardado correctamente.')
              else:
                  print('⚠️ El servidor bloqueó la petición o devolvió contenido inválido.')
          except Exception as e:
              print(f'❌ Excepción crítica: {e}')
          "

      - name: Sincronizar en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Prueba de diagnóstico" && git push)
