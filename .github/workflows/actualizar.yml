name: Actualizar Ligas Automuestreo

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Descargar CSVs limpios mediante Proxy
        run: |
          mkdir -p data
          curl -s "https://api.allorigins.win/raw?url=https%3A%2F%2Fwww.football-data.co.uk%2Fmmz4281%2F2526%2FSP1.csv" -o data/SP1.csv
          curl -s "https://api.allorigins.win/raw?url=https%3A%2F%2Fwww.football-data.co.uk%2Fmmz4281%2F2526%2FE0.csv" -o data/E0.csv
          curl -s "https://api.allorigins.win/raw?url=https%3A%2F%2Fwww.football-data.co.uk%2Fmmz4281%2F2526%2FD1.csv" -o data/D1.csv
          curl -s "https://api.allorigins.win/raw?url=https%3A%2F%2Fwww.football-data.co.uk%2Fmmz4281%2F2526%2FI1.csv" -o data/I1.csv
          curl -s "https://api.allorigins.win/raw?url=https%3A%2F%2Fwww.football-data.co.uk%2Fmmz4281%2F2526%2FF1.csv" -o data/F1.csv

      - name: Guardar y Sincronizar en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de CSVs limpios" && git push)
