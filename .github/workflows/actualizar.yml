name: Actualizar Ligas Automuestreo

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install curl_cffi

      - name: Descargar CSVs con navegador simulado
        run: |
          python -c "
          from curl_cffi import requests
          import os

          os.makedirs('data', exist_ok=True)
          ligas = {
              'SP1.csv': 'https://www.football-data.co.uk/mmz4281/2526/SP1.csv',
              'E0.csv': 'https://www.football-data.co.uk/mmz4281/2526/E0.csv',
              'D1.csv': 'https://www.football-data.co.uk/mmz4281/2526/D1.csv',
              'I1.csv': 'https://www.football-data.co.uk/mmz4281/2526/I1.csv',
              'F1.csv': 'https://www.football-data.co.uk/mmz4281/2526/F1.csv'
          }

          for filename, url in ligas.items():
              try:
                  res = requests.get(url, impersonate='chrome', timeout=30)
                  if res.status_code == 200 and '<html' not in res.text and 'error code' not in res.text:
                      with open(f'data/{filename}', 'w', encoding='utf-8') as f:
                          f.write(res.text)
                      print(f'OK: {filename}')
                  else:
                      print(f'Fallo en {filename}: HTTP {res.status_code}')
              except Exception as e:
                  print(f'Error en {filename}: {e}')
          "

      - name: Sincronizar en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización exitosa con Python" && git push)
