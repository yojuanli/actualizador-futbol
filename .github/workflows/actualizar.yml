name: Actualizar Ligas Automuestreo

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Descargar respaldo directo
        run: |
          python -c "
          import urllib.request
          import os

          os.makedirs('data', exist_ok=True)
          url = 'https://www.football-data.co.uk/mmz4281/2526/SP1.csv'
          
          req = urllib.request.Request(
              url, 
              headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  content = response.read().decode('utf-8')
                  if 'Div' in content and 'HomeTeam' in content:
                      with open('data/SP1.csv', 'w', encoding='utf-8') as f:
                          f.write(content)
                      print('✅ SP1.csv descargado exitosamente.')
                  else:
                      print('⚠️ El contenido recibido no es válido.')
          except Exception as e:
              print(f'❌ El servidor externo sigue bloqueando la conexión: {e}')
          "

      - name: Sincronizar en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Intento de descarga SP1" && git push)
